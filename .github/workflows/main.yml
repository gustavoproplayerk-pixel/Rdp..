name: RDP-Stable-GPU-Optimized

on:
  workflow_dispatch:

jobs:
  secure-rdp-stable:
    # Usa windows-2022-gpu para ter acesso à GPU virtualizada
    runs-on: windows-2022-gpu
    
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        run: |
          # Habilita RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          
          # Permite conexão sem NLA (mais compatível com Tailscale/Redes externas)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          
          # Abre porta 3389 no firewall
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) +
                         [char[]](91..96) + [char[]](123..126))
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
              Add-LocalGroupMember -Group "Administrators" -Member "RDP"
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          } else {
              Set-LocalUser -Name "RDP" -Password $securePass
          }
          
          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV
          
          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "User creation/update failed"
              exit 1
          }

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          # Conecta ao Tailscale usando sua chave secreta
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          
          # Aguarda obter IP
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify Hardware Resources (CPU & GPU)
        id: hardware-check
        run: |
          $cpuCount = (Get-CimInstance Win32_Processor).NumberOfLogicalProcessors
          $gpuInfo = Get-CimInstance Win32_VideoController | Select-Object Name, AdapterRAM
          
          Write-Host "Detected CPU Cores: $cpuCount"
          Write-Host "Detected GPU: $($gpuInfo.Name)"
          
          echo "CPU_CORES=$cpuCount" >> $env:GITHUB_ENV
          echo "GPU_NAME=$($gpuInfo.Name)" >> $env:GITHUB_ENV

      - name: Optimize Windows for Gaming Performance
        run: |
          # Modo Alto Desempenho
          powercfg /setactive 8c5e7f1e-a2b4-4d77-b8e0-9c5d6b8a1f2d
          
          # Desabilita serviços desnecessários que consomem recursos
          Set-Service -Name DiagTrack -StartupType Disabled
          Stop-Service -Name DiagTrack -ErrorAction SilentlyContinue
          Set-Service -Name WSearch -StartupType Manual
          Stop-Service -Name WSearch -ErrorAction SilentlyContinue

      - name: Install Roblox Player
        run: |
          Write-Host "Downloading latest Roblox Installer..."
          $robloxFolder = "$env:LOCALAPPDATA\Roblox"
          $installerUrl = "https://www.roblox.com/download/client/WindowsPlayerLauncher"
          $installerPath = "$env:TEMP\RobloxPlayerLauncher.exe"
          
          try {
              Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath -UseBasicParsing
          } catch {
              # Fallback caso o link principal mude
              $fallbackUrl = "https://clientgamecdn.roblox.com/v/launcher/latest/setup_roblox.exe"
              Invoke-WebRequest -Uri $fallbackUrl -OutFile $installerPath -UseBasicParsing
          }

          Write-Host "Installing Roblox..."
          Start-Process -FilePath $installerPath -ArgumentList "/S" -Wait
          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

          if (Test-Path "$robloxFolder\Versions") {
              Write-Host "Roblox installed successfully."
          } else {
              Write-Error "Roblox installation verification failed."
              exit 1
          }

      - name: Launch Roblox Launcher
        run: |
          # Inicia apenas o launcher para que você possa conectar via RDP e escolher o jogo
          $robloxBin = Get-ChildItem -Path "$env:LOCALAPPDATA\Roblox\Versions" -Recurse -Filter "RobloxPlayerLauncher.exe" | Select-Object -First 1
          
          if ($robloxBin) {
              Write-Host "Launching Roblox Client..."
              Start-Process $robloxBin.FullName
              
              # Aguarda o processo iniciar
              Start-Sleep -Seconds 10
              
              if (Get-Process "RobloxPlayerLauncher" -ErrorAction SilentlyContinue) {
                  Write-Host "Roblox is running and ready for connection."
              } else {
                  Write-Warning "Roblox process did not start immediately."
              }
          } else {
              Write-Error "Roblox executable not found."
          }

      - name: Final Status
        run: |
          Write-Host "=========================================="
          Write-Host "SYSTEM READY"
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "RDP User: RDP"
          Write-Host "RDP Port: 3389"
          Write-Host "CPU Cores: $env:CPU_CORES"
          Write-Host "GPU: $env:GPU_NAME"
          Write-Host "=========================================="
